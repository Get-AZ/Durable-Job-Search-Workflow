[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-job-search-workflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["job_workflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]